name: Render course review PDFs (temporary)

on:
  push:
    branches:
      - review-course-architecture-map-20261013
    paths:
      - '.github/workflows/render-course-review-once.yml'
      - 'course_architecture.typ'
      - 'curriculum_map.typ'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install pinned Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"

      - name: Compile both course documents
        run: |
          typst compile --root . --creation-timestamp 0 course_architecture.typ course_architecture.pdf
          typst compile --root . --creation-timestamp 0 curriculum_map.typ curriculum_map.pdf

      - name: Commit synchronized PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_architecture.pdf curriculum_map.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render synchronized course architecture and curriculum map PDFs"
            git push
          fi

      - name: Upload review PDFs
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-review-pdfs
          path: |
            course_architecture.pdf
            curriculum_map.pdf
