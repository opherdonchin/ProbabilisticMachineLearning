name: Render architecture PDF (temporary review branch)
# Retry transient workflow registration after branch creation
on:
  push:
    branches: [course-architecture-regimes-l07-l12-20261013]
    paths:
      - course_architecture.typ
      - .github/workflows/course-architecture-pdf-regimes-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"
      - name: Compile deterministic PDF
        run: |
          bash scripts/render_course_architecture.sh
          python - <<'PY'
          from pathlib import Path
          f=Path("course_architecture.pdf")
          assert f.read_bytes().startswith(b"%PDF-")
          assert f.stat().st_size > 10000
          print("PDF bytes:", f.stat().st_size)
          PY
      - name: Commit synchronized render
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- course_architecture.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render L07-L12 method-regime course architecture"
            git push origin HEAD:course-architecture-regimes-l07-l12-20261013
          fi
