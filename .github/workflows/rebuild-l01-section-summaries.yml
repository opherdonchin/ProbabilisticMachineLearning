name: Rebuild Lecture 1 section summaries

on:
  push:
    paths:
      - .github/workflows/rebuild-l01-section-summaries.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild section summaries
        run: python scripts/rebuild_l01_section_summaries.py

      - uses: typst-community/setup-typst@v4

      - name: Compile and reject slide overflow
        run: |
          set -o pipefail
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck.typ /tmp/lecture01.pdf 2>&1 | tee /tmp/typst.log
          if grep -q 'slide content overflow' /tmp/typst.log; then
            echo 'Touying overflow warning remains' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lecture01-section-summaries
          path: /tmp/lecture01.pdf

      - name: Commit section summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lectures/L01_Probability_Statistics/slide_deck.typ
          git rm scripts/rebuild_l01_section_summaries.py
          git commit -m 'Rebuild Lecture 1 section summaries'
          git push
