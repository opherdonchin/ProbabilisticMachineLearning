name: Temporary architecture visual previews
on:
  push:
    branches: [course-architecture-practical-mastery-20261013]
    paths: [.github/workflows/course-architecture-visual-temp.yml]
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render selected PDF pages
        run: |
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import fitz
          from pathlib import Path
          src=fitz.open('course_architecture.pdf')
          print('Pages:',len(src))
          p=Path('.architecture-preview')
          p.mkdir(exist_ok=True)
          for page_index in (0,6,7,8,10,11):
            page=src[page_index]
            assert page.rect.width > 300 and page.rect.height > 300
            page.get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False).save(str(p/f'page-{page_index+1:02d}.png'))
            print(page_index+1, page.rect, len(page.get_text()))
          PY
      - name: Publish temporary review images to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .architecture-preview
          git commit -m "Temporary visual previews of course architecture"
          git push origin HEAD:course-architecture-practical-mastery-20261013
