name: Typst validation

on:
  push:
    branches:
      - slide-authoring-refactor
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst 0.15.0
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"

      - name: Compile pass 00 reference
        run: |
          mkdir -p build/typst-validation
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_00.typ build/typst-validation/slide_deck_00.pdf

      - name: Compile live Lecture 1
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck.typ build/typst-validation/slide_deck.pdf

      - name: Compile pass 03 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_03.typ build/typst-validation/slide_deck_03.pdf

      - name: Compile pass 04 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_04.typ build/typst-validation/slide_deck_04.pdf

      - name: Compile pass 05 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_05.typ build/typst-validation/slide_deck_05.pdf

      - name: Upload compiled decks
        uses: actions/upload-artifact@v4
        with:
          name: typst-validation
          path: build/typst-validation/*.pdf
