[project]
name = "probabilistic-machine-learning"
version = "0.1.0"
description = "Reproducible local environment for the course notebooks"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Scientific-package pins follow the published Google Colab 2026.07 CPU
    # runtime. Notebook tooling is local infrastructure and need not mirror
    # Colab exactly.
    "numpy==2.0.2",
    "scipy==1.16.3",
    "matplotlib==3.10.0",
    "ipykernel>=6,<7",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false
