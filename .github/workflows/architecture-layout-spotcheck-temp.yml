name: Temporary final-layout spotcheck
on:
  push:
    branches: [course-architecture-practical-mastery-20261013]
    paths: [.github/workflows/architecture-layout-spotcheck-temp.yml]
permissions:
  contents: write
jobs:
  view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render table transition
        run: |
          python -m pip install -q pymupdf
          python - <<'PY'
          import fitz
          d=fitz.open('course_architecture.pdf')
          for i in (6,7):
            page=d[i]
            print('Page',i+1,'size',page.rect,'text length',len(page.get_text()))
            page.get_pixmap(matrix=fitz.Matrix(1.1,1.1),alpha=False).save(f'.temp-layout-{i+1}.png')
          PY
      - name: Commit spotcheck images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .temp-layout*.png
          git commit -m "Temporary final layout spotcheck"
          git push origin HEAD:course-architecture-practical-mastery-20261013
