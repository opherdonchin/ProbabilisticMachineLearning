name: Publish course architecture PDF (temporary task-refinement branch)
on:
  push:
    branches:
      - task-structure-performance-induce-computation-20261013
    paths:
      - course_architecture.typ
      - .github/workflows/course-architecture-pdf-task-refinement-temp.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"
      - name: Generate source-matched PDF
        run: |
          bash scripts/render_course_architecture.sh
          python - <<'PY'
          from pathlib import Path
          p=Path("course_architecture.pdf")
          assert p.read_bytes().startswith(b"%PDF-")
          assert p.stat().st_size > 10000
          PY
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_architecture.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render task-refined course architecture PDF"
            git push origin HEAD:task-structure-performance-induce-computation-20261013
          fi
