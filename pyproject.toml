[project]
name = "probabilistic-machine-learning"
version = "0.1.0"
description = "Reproducible local environment for the course notebooks"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Scientific-package pins follow the published Google Colab 2026.07 CPU
    # runtime. Notebook tooling is local infrastructure and need not mirror
    # Colab exactly.
    "numpy==2.0.2",
    "scipy==1.16.3",
    "matplotlib==3.10.0",
    "ipykernel>=6,<7",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "pml-course-support",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
pml-course-support = { workspace = true, editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.workspace]
members = [
    "notebook_support",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pml-course-support = { path = "notebook_support", editable = true }
probabilistic-machine-learning = { path = ".", editable = true }

[tool.pixi.tasks]
