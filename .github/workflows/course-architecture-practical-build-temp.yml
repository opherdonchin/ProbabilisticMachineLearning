name: Build revised course architecture (temporary)
on:
  push:
    branches: [course-architecture-practical-mastery-20261013]
    paths:
      - course_architecture.typ
      - advanced_statistics_2027_1_syllabus.typ
      - .github/workflows/course-architecture-practical-build-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"
      - name: Compile deterministic architecture PDF
        run: bash scripts/render_course_architecture.sh
      - name: Compile student syllabus
        run: |
          mkdir -p build/architecture-review
          typst compile --root . advanced_statistics_2027_1_syllabus.typ build/architecture-review/advanced_statistics_2027_1_syllabus.pdf
      - name: Check PDF pages and text
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path("course_architecture.pdf").read_bytes()
          assert b.startswith(b"%PDF-") and b.rstrip().endswith(b"%%EOF")
          print("Architecture PDF bytes:",len(b))
          PY
          if command -v pdfinfo >/dev/null; then pdfinfo course_architecture.pdf | grep -E 'Pages:|Page size:|File size:'; fi
          if command -v pdftotext >/dev/null; then
            pdftotext -layout course_architecture.pdf build/architecture-review/extracted.txt
            grep -q 'What the course is for' build/architecture-review/extracted.txt
            grep -q 'Proposed lecture and problem-solving practice map' build/architecture-review/extracted.txt
            grep -q 'Selection, omissions' build/architecture-review/extracted.txt
            grep -q 'L12' build/architecture-review/extracted.txt
          fi
      - name: Commit synchronized architecture PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_architecture.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render competence-first course architecture PDF"
            git push origin HEAD:course-architecture-practical-mastery-20261013
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-and-syllabus-pdfs
          path: |
            course_architecture.pdf
            build/architecture-review/advanced_statistics_2027_1_syllabus.pdf
