name: Render curriculum maps (temporary)

on:
  push:
    branches:
      - review-course-architecture-map-20261013
    paths:
      - '.github/workflows/render-curriculum-review-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"
      - name: Build all three documents
        run: |
          typst compile --root . --creation-timestamp 0 course_architecture.typ course_architecture.pdf
          typst compile --root . --creation-timestamp 0 curriculum_map.typ curriculum_map.pdf
          typst compile --root . --creation-timestamp 0 curriculum_map_actual.typ curriculum_map_actual.pdf
      - name: Commit synchronized PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_architecture.pdf curriculum_map.pdf curriculum_map_actual.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render synchronized architecture and two curriculum maps"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: curriculum-maps-validated
          path: |
            course_architecture.pdf
            curriculum_map.pdf
            curriculum_map_actual.pdf
