name: Typst validation

on:
  push:
    branches:
      - slide-authoring-refactor
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst 0.15.0
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"

      - name: Compile pass 00 reference
        run: |
          mkdir -p build/typst-validation
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_00.typ build/typst-validation/slide_deck_00.pdf

      - name: Compile live Lecture 1 handout
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck.typ build/typst-validation/slide_deck.pdf

      - name: Compile live Lecture 1 presentation reveals
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("Lectures/L01_Probability_Statistics/slide_deck.typ")
          temporary = source.with_name(".slide_deck_presentation.typ")
          text = source.read_text(encoding="utf-8")
          needle = "config-common(handout: true)"
          assert text.count(needle) == 1, "expected one explicit handout setting"
          temporary.write_text(text.replace(needle, "config-common(handout: false)"), encoding="utf-8")
          PY
          typst compile --root . Lectures/L01_Probability_Statistics/.slide_deck_presentation.typ build/typst-validation/slide_deck_presentation.pdf
          rm Lectures/L01_Probability_Statistics/.slide_deck_presentation.typ

      - name: Compile pass 03 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_03.typ build/typst-validation/slide_deck_03.pdf

      - name: Compile pass 04 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_04.typ build/typst-validation/slide_deck_04.pdf

      - name: Compile pass 05 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_05.typ build/typst-validation/slide_deck_05.pdf

      - name: Compile pass 06 snapshot
        run: |
          typst compile --root . Lectures/L01_Probability_Statistics/slide_deck_06.typ build/typst-validation/slide_deck_06.pdf

      - name: Upload compiled decks
        uses: actions/upload-artifact@v4
        with:
          name: typst-validation
          path: build/typst-validation/*.pdf
