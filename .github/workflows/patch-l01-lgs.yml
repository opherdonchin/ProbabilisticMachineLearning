name: Rebuild Lecture 1 LGS tail

on:
  push:
    paths:
      - .github/workflows/patch-l01-lgs.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild slide source
        run: python scripts/patch_l01_lgs_tail.py

      - name: Generate sensor fusion figure
        run: |
          python -m pip install --quiet matplotlib
          cd Lectures/L01_Probability_Statistics
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path('sensor_fusion_figure.ipynb').read_text())
          ns = {}
          for cell in nb['cells']:
              if cell['cell_type'] == 'code':
                  exec(''.join(cell['source']), ns)
          PY
          rm -f generated/sensor_fusion_schematic.png

      - uses: typst-community/setup-typst@v4

      - name: Compile Lecture 1
        run: typst compile --root . Lectures/L01_Probability_Statistics/slide_deck.typ /tmp/lecture01.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: lecture01-rebuilt
          path: /tmp/lecture01.pdf

      - name: Commit rebuilt deck
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lectures/L01_Probability_Statistics/slide_deck.typ
          git add Lectures/L01_Probability_Statistics/generated/sensor_fusion_schematic.svg
          git rm scripts/patch_l01_lgs_tail.py
          git commit -m 'Rebuild Lecture 1 linear Gaussian tail'
          git push
