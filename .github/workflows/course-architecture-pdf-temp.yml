name: Publish course architecture PDF (temporary course edit)

on:
  push:
    branches:
      - course-architecture-problem-families-20261013
    paths:
      - course_architecture.typ
      - .github/workflows/course-architecture-pdf-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.0"
      - name: Compile checked-in PDF
        run: |
          bash scripts/render_course_architecture.sh
          python - <<'PY'
          from pathlib import Path
          pdf = Path("course_architecture.pdf")
          assert pdf.read_bytes().startswith(b"%PDF-")
          assert pdf.stat().st_size > 10000
          PY
      - name: Commit synchronized PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_architecture.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Re-render course architecture after problem-family revision"
            git push origin HEAD:course-architecture-problem-families-20261013
          fi
